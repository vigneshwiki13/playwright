name: Playwright Tests with Azure Playwright Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs for the same branch to save Azure/GitHub minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required if using Azure OIDC authentication

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js with automated npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # Step 3: Install Node dependencies
      - name: Install Node Dependencies
        run: npm ci

      # Step 4: Install Playwright Browsers & Linux OS dependencies
      # Prevents missing 'chromium_headless_shell' or X11 errors
      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      # Step 5: Log in to Azure using Service Principal Secret
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 6: Execute Playwright tests using Azure Service Config
      - name: Run Playwright Tests on Azure
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        run: npx playwright test --config=playwright.service.config.js --workers=4

      # Step 7: Upload HTML test report as GitHub Actions Artifact
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
